x-n8n-env: &n8n-env
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_PORT: 5432
  DB_POSTGRESDB_DATABASE: n8n
  DB_POSTGRESDB_USER: n8n
  DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
  N8N_SECURE_COOKIE: "false"
  WEBHOOK_URL: http://localhost:5678/
  GENERIC_TIMEZONE: Asia/Kolkata
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_RUNNERS_ENABLED: "true"
  N8N_RUNNERS_MODE: external
  N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
  N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
  NODES_EXCLUDE: "[]"
  N8N_RESTRICT_FILE_ACCESS_TO: /files
  EXECUTIONS_MODE: queue
  QUEUE_BULL_REDIS_HOST: redis
  QUEUE_BULL_REDIS_PORT: 6379
  OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
  NO_PROXY: postgres,redis,n8n,n8n-worker,task-runners,host.docker.internal,localhost,127.0.0.1
  no_proxy: postgres,redis,n8n,n8n-worker,task-runners,host.docker.internal,localhost,127.0.0.1

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: n8n
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:${N8N_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      <<: *n8n-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - n8n_data:/home/node/.n8n
      - ./watch:/files/incoming

  n8n-worker:
    image: n8nio/n8n:${N8N_VERSION:-latest}
    command: worker
    restart: unless-stopped
    environment:
      <<: *n8n-env
    depends_on:
      - n8n
    volumes:
      - n8n_data:/home/node/.n8n
      - ./watch:/files/incoming

  task-runners:
    image: n8nio/runners:${N8N_VERSION:-latest}
    restart: unless-stopped
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n-worker:5679
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
      NO_PROXY: n8n,n8n-worker,localhost,127.0.0.1
      no_proxy: n8n,n8n-worker,localhost,127.0.0.1
    volumes:
      - ./n8n-task-runners.json:/etc/n8n-task-runners.json:ro
    depends_on:
      - n8n-worker

volumes:
  pg_data:
  n8n_data: